version: '3.8'

services:
  telemetry_collector:
    build:
      context: ./lab/telemetry_collector
      dockerfile: Dockerfile
    container_name: telemetry_collector
    ports:
      - "8081:8081"
    environment:
      - DEBUG=${DEBUG:-false}
      - TELEMETRY_STORAGE_PATH=/data/telemetry.db
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - telemetry_data:/data
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  agentic_ai:
    build:
      context: ./lab/agentic_ai
      dockerfile: Dockerfile
    container_name: agentic_ai
    ports:
      - "8082:8082"
    environment:
      - DEBUG=${DEBUG:-false}
      - TELEMETRY_COLLECTOR_URL=http://telemetry_collector:8081
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
    depends_on:
      telemetry_collector:
        condition: service_healthy
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    build:
      context: ./lab/gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - DEBUG=${DEBUG:-false}
      - TELEMETRY_COLLECTOR_URL=http://telemetry_collector:8081
      - AGENTIC_AI_URL=http://agentic_ai:8082
      - UI_DASH_URL=http://ui_dash:3000
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    depends_on:
      telemetry_collector:
        condition: service_healthy
      agentic_ai:
        condition: service_healthy
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ui_dash:
    build:
      context: ./lab/ui_dash
      dockerfile: Dockerfile
    container_name: ui_dash
    ports:
      - "3000:3000"
    environment:
      - DEBUG=${DEBUG:-false}
      - GATEWAY_URL=http://gateway:8080
      - API_KEY=${API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lab_network:
    driver: bridge

volumes:
  telemetry_data:
