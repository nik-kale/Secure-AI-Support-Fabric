version: '3.8'

services:
  telemetry_collector:
    build:
      context: ./lab/telemetry_collector
      dockerfile: Dockerfile
    container_name: telemetry_collector
    ports:
      - "8081:8081"
    environment:
      - DEBUG=${DEBUG:-false}
      - TELEMETRY_STORAGE_PATH=/data/telemetry.db
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - telemetry_data:/data
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  otel_collector:
    build:
      context: ./lab/otel_collector
      dockerfile: Dockerfile
    container_name: otel_collector
    ports:
      - "4318:4318"  # OTLP HTTP
    environment:
      - DEBUG=${DEBUG:-false}
      - OTEL_STORAGE_PATH=/data/otel.db
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - otel_data:/data
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4318/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  agentic_ai:
    build:
      context: ./lab/agentic_ai
      dockerfile: Dockerfile
    container_name: agentic_ai
    ports:
      - "8082:8082"
    environment:
      - DEBUG=${DEBUG:-false}
      - TELEMETRY_COLLECTOR_URL=http://telemetry_collector:8081
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
    depends_on:
      telemetry_collector:
        condition: service_healthy
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    build:
      context: ./lab/gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - DEBUG=${DEBUG:-false}
      - TELEMETRY_COLLECTOR_URL=http://telemetry_collector:8081
      - AGENTIC_AI_URL=http://agentic_ai:8082
      - UI_DASH_URL=http://ui_dash:3000
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    depends_on:
      telemetry_collector:
        condition: service_healthy
      agentic_ai:
        condition: service_healthy
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ui_dash:
    build:
      context: ./lab/ui_dash
      dockerfile: Dockerfile
    container_name: ui_dash
    ports:
      - "3000:3000"
    environment:
      - DEBUG=${DEBUG:-false}
      - GATEWAY_URL=http://gateway:8080
      - API_KEY=${API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # V2.2: Distributed Tracing Visualization
  trace_visualizer:
    build:
      context: ./lab/trace_visualizer
      dockerfile: Dockerfile
    container_name: trace_visualizer
    ports:
      - "8085:8085"
    environment:
      - DEBUG=${DEBUG:-false}
      - OTEL_COLLECTOR_URL=http://otel_collector:4318
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    depends_on:
      - otel_collector
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # V2.7: Full-text Log Search
  log_search:
    build:
      context: ./lab/log_search
      dockerfile: Dockerfile
    container_name: log_search
    ports:
      - "8086:8086"
    environment:
      - DEBUG=${DEBUG:-false}
      - LOG_STORAGE_PATH=/data/logs.db
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - log_data:/data
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    security_opt:
      - no-new-privileges:true

  # V4.2: Multi-channel Notification Service
  notification_service:
    build:
      context: ./lab/notification_service
      dockerfile: Dockerfile
    container_name: notification_service
    ports:
      - "8087:8087"
    environment:
      - DEBUG=${DEBUG:-false}
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
    networks:
      - lab_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

networks:
  lab_network:
    driver: bridge

volumes:
  telemetry_data:
  otel_data:
  log_data:
